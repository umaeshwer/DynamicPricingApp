version: "3.9"

services:

  scylla:
    image: scylladb/scylla:5.4
    container_name: scylla
    ports:
      - "9042:9042"
    volumes:
      - scylla_data:/var/lib/scylla
    command: --smp 1 --memory 750M --overprovisioned 1
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  schema-init:
    image: scylladb/scylla:5.4
    depends_on:
      scylla:
        condition: service_healthy
    volumes:
      - ./schema.cql:/schema.cql:ro
    entrypoint: >
      bash -c "cqlsh scylla -f /schema.cql && echo 'Schema applied.'"
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pricing-api
    ports:
      - "8000:8000"
    environment:
      SCYLLA_HOSTS: scylla
      SCYLLA_USER:  cassandra
      SCYLLA_PASS:  cassandra
      SCYLLA_DC:    datacenter1
    depends_on:
      - schema-init
    restart: on-failure

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: pricing-dashboard
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    restart: on-failure

volumes:
  scylla_data:
